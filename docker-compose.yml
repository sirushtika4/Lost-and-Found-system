services:
  backend:
    image: lost-found-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lost-found-backend
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/lost_found_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in an ignored root .env file}
      AUTH_MODE: ${AUTH_MODE:-local}
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: lost-found-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: lost-found-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
