services:
  backend:
    image: lost-found-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lost-found-backend
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: lost-found-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: lost-found-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
